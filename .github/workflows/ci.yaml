name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint kube-score helm
          curl -L https://github.com/open-policy-agent/conftest/releases/latest/download/conftest_Linux_x86_64.tar.gz | tar -xz
          sudo mv conftest /usr/local/bin/
      - name: yamllint
        run: yamllint .
      - name: helm template
        run: helm template ./charts/backpack-api
      - name: kube-score
        run: kube-score score manifests/*.yaml
      - name: conftest
        run: conftest test manifests || true
